[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botrail-mujoco"
version = "0.1.0"
description = "Run botrail robot cells (PLC sequences, motion plans) on MuJoCo physics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "botrail>=0.13",
  "mujoco>=3.2",
  "usd-core>=24.0",
  "numpy>=1.24",
  "pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
botrail-mujoco = "botrail_mujoco.__main__:main"
botrail-mujoco-view = "botrail_mujoco.view:main"

[tool.setuptools]
packages = ["botrail_mujoco"]

[tool.setuptools.package-data]
botrail_mujoco = ["viewer/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
